[package]
name = "relay"
version = "0.1.0"
edition = "2021"
default-run = "relay"
[features]
default = []
devtools = ["tauri/devtools"]
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6"
rand = "0.8"
tiny_http = "0.12"
reqwest = { version = "0.13", features = ["blocking", "json", "rustls", "webpki-roots"], default-features = false }
notify-rust = "4"
libc = "0.2"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dev-dependencies]
tempfile = "3"
[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"
